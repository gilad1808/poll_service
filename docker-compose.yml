
services:
  poll_db:
    image: mysql:8.0
    container_name: poll_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-poll_demo_password}
      MYSQL_DATABASE: poll_db
    ports:
      - "3308:3306"
    volumes:
      - poll_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  poll_data:
